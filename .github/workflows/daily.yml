name: daily
on:
  schedule:
    - cron: "17 */3 * * *" # 3 tiếng/lần: dùng quota free ngay khi có
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      # Giữ phần đã làm (giọng đọc, ảnh) khi lần trước dừng vì hết quota.
      - uses: actions/cache/restore@v4
        with:
          path: .render
          key: render-${{ github.run_id }}
          restore-keys: render-
      - run: pnpm exec tsx pipeline/daily.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Lưu cả khi lỗi/hết quota để lần sau không tốn lại lượt TTS và ảnh đã làm.
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .render
          key: render-${{ github.run_id }}
