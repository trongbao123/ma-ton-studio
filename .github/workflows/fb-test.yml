name: fb-test
# Phép thử Facebook (Kế hoạch 1, Task 4): tự tạo clip thử rồi đăng lên Page của kênh — xem app Meta đã đủ quyền chưa,
# bài có hiện công khai không. Chạy tay: Actions → fb-test → Run workflow. Đăng xong nhớ xoá bài thử trên Page.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Khoá kênh (vd lich-su)"
        required: true
        default: lich-su
      mode:
        description: "reel (10 giây dọc) hoặc video (20 giây ngang)"
        required: true
        default: reel
        type: choice
        options: [reel, video, delete]
      ids:
        description: "Chế độ delete: id các bài cần xoá, cách nhau dấu phẩy"
        required: false
        default: ""
      draft:
        description: "Tải dạng nháp (chủ kênh tự bấm đăng trên Meta Business Suite)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fb-test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tạo clip thử
        if: inputs.mode != 'delete'
        run: |
          if [ "$MODE" = reel ]; then SIZE=1080x1920; SECS=10; else SIZE=1920x1080; SECS=20; fi
          ffmpeg -v error -f lavfi -i "color=c=0x3b2a1a:s=$SIZE:d=$SECS" -f lavfi -i anullsrc=r=44100:cl=stereo -shortest \
            -c:v libx264 -pix_fmt yuv420p -c:a aac test.mp4
        env:
          MODE: ${{ inputs.mode }}
      # Đầu vào truyền qua env (không chèn thẳng vào lệnh) để tránh chèn lệnh.
      - run: |
          if [ "$MODE" = delete ]; then TARGET="$IDS"; else TARGET=test.mp4; fi
          pnpm exec tsx scripts/fb-test-post.mts "$CHANNEL" "$MODE" "$TARGET" "Thử hệ thống — sẽ xoá" "Bài thử tự động"
        env:
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
          IDS: ${{ inputs.ids }}
          FB_DRAFT: ${{ inputs.draft && '1' || '0' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
