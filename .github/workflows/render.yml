name: render
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID video cần render"
        required: true
permissions:
  contents: write
concurrency:
  group: render-${{ inputs.video_id }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      # Giữ phần đã làm (giọng đọc, ảnh) khi lần trước dừng vì hết quota.
      - uses: actions/cache/restore@v4
        with:
          path: .render
          key: render-${{ github.run_id }}
          restore-keys: render-
      - run: pnpm exec tsx pipeline/render.ts ${{ inputs.video_id }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      # Lưu cả khi lỗi/hết quota để lần sau không tốn lại lượt TTS và ảnh đã làm.
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .render
          key: render-${{ github.run_id }}
