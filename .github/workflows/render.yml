name: render
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID video cần render"
        required: true
permissions:
  contents: write
concurrency:
  group: render-${{ inputs.video_id }}
jobs:
  render:
    # Biến repo RUNNER_LABEL = "oracle" → chạy trên máy Oracle free (scripts/oracle-runner.sh, 0 phút Actions); chưa đặt → máy GitHub.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 180 # video dài ~180 cảnh + phụ đề karaoke mất ~1,5–2 giờ
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: ./.github/actions/setup-ffmpeg
      # Mô hình độ sâu cho parallax 2.5D (Depth Anything V2 Small int8, ~27MB): tải 1 lần rồi cache; thiếu/lỗi thì dựng zoompan như cũ.
      - uses: actions/cache@v4
        with:
          path: .cache/depth
          key: depth-anything-v2-small-int8
      - run: pnpm install --frozen-lockfile
      # AI dùng gói Pro/Plus (Claude Code, Codex, Gemini CLI) — không tốn credit API; đăng nhập dán ở Cài đặt AI.
      # Cài lỗi thì vẫn chạy tiếp bằng API như cũ.
      # Cache CLI AI theo phiên bản (đỡ ~1 phút/lượt cài lại → tiết kiệm phút Actions của repo private).
      - id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cli
          key: cli-${{ runner.arch }}-claude2.1.311-codex0.166.0-gemini0.65.0
      - if: steps.cli-cache.outputs.cache-hit != 'true'
        run: npm i -g --prefix ~/.cli @anthropic-ai/claude-code@2.1.311 @openai/codex@0.166.0 @google/gemini-cli@0.65.0
        continue-on-error: true
      - run: echo "$HOME/.cli/bin" >> "$GITHUB_PATH"
      # Giữ phần đã làm (giọng đọc, ảnh) khi lần trước dừng vì hết quota.
      - uses: actions/cache/restore@v4
        with:
          path: .render
          key: render-${{ github.run_id }}
          restore-keys: render-
      - run: pnpm exec tsx pipeline/render.ts ${{ inputs.video_id }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GEMINI_OAUTH_CREDS: ${{ secrets.GEMINI_OAUTH_CREDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDIQ_API_KEY: ${{ secrets.VIDIQ_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      # Lưu cả khi lỗi/hết quota để lần sau không tốn lại lượt TTS và ảnh đã làm.
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .render
          key: render-${{ github.run_id }}
