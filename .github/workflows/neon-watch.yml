name: neon-watch
# Neon free hết hạn mức 23/11/2026 (khoá cả đọc). Mỗi ngày thử đọc; mở lại thì báo Telegram để chép dữ liệu cũ sang Supabase
# (KHÔNG tự chép — gộp bằng workflow neon-merge, chạy dry trước). Gộp xong thì xoá workflow này.
on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Thử đọc Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          host=$(echo "$NEON_DATABASE_URL" | sed -E 's#.*@([^/]+)/.*#\1#')
          res=$(curl -s -X POST "https://$host/sql" -H "Neon-Connection-String: $NEON_DATABASE_URL" -H "Content-Type: application/json" -d '{"query":"select count(*) as n from videos"}')
          if echo "$res" | grep -q '"rows"'; then
            echo "Neon đã mở lại: $res"
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text="✅ Neon đã mở lại — đọc được dữ liệu cũ. Vào Actions chạy workflow neon-merge: dry trước, ổn thì run (gộp, không xoá dữ liệu mới)." >/dev/null
          else
            echo "Neon vẫn khoá: $(echo "$res" | head -c 150)"
          fi
