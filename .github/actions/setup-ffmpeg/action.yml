name: setup-ffmpeg
description: >
  Bảo đảm có ffmpeg + ffprobe đủ bộ lọc app dùng. Máy đã có sẵn (container runner tự host cài sẵn trong image)
  thì dùng luôn, khỏi cài mỗi lượt; không có / thiếu bộ lọc thì cài bằng apt-get như máy GitHub.
  (Bản static johnvansickle 7.0.2 thiếu drawtext nên không dùng.)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        check() {
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || return 1
          local filters
          filters=$(ffmpeg -hide_banner -filters 2>/dev/null)
          for f in ass drawtext zoompan xfade loudnorm sidechaincompress ebur128 amix alimiter; do
            echo "$filters" | grep -qE "^ [.A-Z|]+ $f " || { echo "ffmpeg thiếu bộ lọc $f"; return 1; }
          done
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264 || { echo "ffmpeg thiếu libx264"; return 1; }
        }
        if check; then
          echo "Dùng ffmpeg có sẵn: $(ffmpeg -hide_banner -version | head -1)"
        else
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          check
        fi
